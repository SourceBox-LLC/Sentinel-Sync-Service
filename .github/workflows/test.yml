name: Test & Deploy

# Tests on every push and PR; deploys to Fly on pushes to master.
#
# Deploy automation used to be deferred here so a human could watch the
# first-ever deploy of new infrastructure. That rationale expired once
# the service was live, and leaving it deferred created a worse problem:
# fly.toml became a file that did nothing. A scale-to-zero change was
# merged with CI green on 2026-09-09 and simply never reached Fly —
# the app kept running always-on until someone noticed and deployed by
# hand. Config that silently doesn't apply is more dangerous than no
# config, so this now ships.
#
# Unlike License-Service's version, this one needs a real Postgres
# service container — JSONB isn't SQLite-portable, and this service is
# Postgres-native from day one.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least-privilege token. Without this block a job gets whatever the
# repository's default GITHUB_TOKEN scope is, which is broader than
# anything here needs — CodeQL's actions/missing-workflow-permissions
# flagged every job in this file. Nothing here writes through the API:
# no `gh` calls, no git push, no package publish. Artifact upload does
# not need a contents scope either (it uses the runtime token).
#
# A job that genuinely needs more should declare it at the JOB level
# rather than widening this.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sentinel_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cuts a cold dependency build to seconds on repeat runs.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      # Not `-D warnings`, matching CameraNode: a style warning shouldn't
      # go red on arrival and train everyone to ignore the column. This
      # still fails on any clippy *error*.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Formatting
        run: cargo fmt --check

      # The wire-contract tests need a real Postgres — they exercise the
      # tombstone/revive semantics and keyset pagination against actual
      # SQL, which is where a port breaks. Without TEST_DATABASE_URL they
      # skip themselves, so this variable is what makes them run.
      - name: Tests
        run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgresql://sync:sync@localhost:5432/sentinel_sync_test

      # Same gate the sibling repos run, one ecosystem over.
      #
      # RUSTSEC-2023-0071 is ignored, narrowly and deliberately. It is the
      # Marvin timing attack in `rsa`, which has no fixed version — but
      # `rsa` is not compiled into this binary. It reaches Cargo.lock
      # through `sqlx-mysql`, an OPTIONAL dependency of the sqlx facade
      # that this crate never enables (features here are postgres, chrono,
      # json, macros, migrate). Cargo.lock records the union of optional
      # dependencies regardless of features, and `cargo audit` reads the
      # lockfile rather than the built graph, so it flags a crate that
      # isn't there. Verified:
      #
      #   $ cargo tree -e normal | grep sqlx-
      #     sqlx-core, sqlx-macros, sqlx-macros-core, sqlx-postgres
      #     (no sqlx-mysql, no rsa)
      #
      # There is no feature combination that removes it while using sqlx,
      # so the alternative was a permanently red gate — which is worse
      # than a documented waiver, because it trains everyone to ignore the
      # column. Re-check when sqlx restructures its optional backends or
      # `rsa` ships a fix.
      - name: Security advisories (cargo audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --ignore RUSTSEC-2023-0071

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    # Push-only: a PR runs the tests above but never ships.
    if: github.event_name == 'push'
    # Serialize so two quick pushes don't race on the machine update.
    # Queue rather than cancel, and deploy only if this commit is still
    # master's head: with cancel-in-progress, whichever run *reached*
    # this job last won, even an older commit (Command Center shipped its
    # parent commit that way on 2026-10-07). An older run that comes up
    # late now steps aside for the newer one.
    concurrency:
      group: deploy-sentinel-sync
      cancel-in-progress: false
    steps:
      - name: Deploy only the newest commit on master
        id: newest
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/master | cut -f1)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "master is at $head now; its own run deploys it. Skipping ${{ github.sha }}."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.newest.outputs.deploy == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.newest.outputs.deploy == 'true'

      # --ha=false: Fly provisions TWO machines by default and this
      # service needs one. It did exactly that on the 2026-09-09 manual
      # deploy and the extra machine had to be scaled away by hand.
      #
      # No --strategy override: this app has no volume, so the default
      # rolling strategy works. (Command Center needs `immediate`
      # because its web machine mounts a single-attachment volume.)
      - name: flyctl deploy
        if: steps.newest.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --ha=false --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
