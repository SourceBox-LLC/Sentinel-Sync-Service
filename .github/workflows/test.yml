name: Test

# Deploy automation is deferred deliberately, same rationale as
# Sentinel-License-Service's workflow of the same name: a human should
# be watching the first-ever deploy of new infrastructure (including,
# for this service, the first-ever Postgres instance in this family).
# This workflow only covers lint + dependency audit + tests.
#
# Unlike License-Service's version, this one needs a real Postgres
# service container — JSONB isn't SQLite-portable, and this service is
# Postgres-native from day one.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: sync
          POSTGRES_DB: sentinel_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sync:sync@localhost:5432/sentinel_sync_test
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check

      - name: Dependency scan (pip-audit)
        run: uv run pip-audit --strict

      - name: Alembic migrations apply cleanly
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://sync:sync@localhost:5432/sentinel_sync_test

      - name: Run tests
        run: uv run pytest -v
