[project]
name = "sentinel-sync-service"
version = "0.1.0"
description = "Cloud data-sync mirror for self-hosted Sentinel Command Center installs — one-way, license-gated backup of a self-host's local database into a hosted Postgres."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.10",
    "sentry-sdk[fastapi]>=2.68.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E9", "W6", "I", "B", "UP"]
ignore = ["B008", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "B017"]
"**/__init__.py" = ["F401"]
"alembic/**" = ["F401"]
