# Sentinel Sync Service — Fly.io app configuration.
#
# Unlike Command Center and License-Service, this service has no
# attached volume — its data lives in an external Postgres (Fly
# Postgres, Neon, RDS, etc; provisioning that instance is an infra/cost
# decision made separately, not something this config does for you —
# set DATABASE_URL as a Fly secret before first deploy). That also
# means, unlike those two SQLite-on-a-volume services, this one CAN run
# multiple machines / rolling deploys safely if load ever calls for it.

app = "sentinel-sync"
primary_region = "sjc"

[build]

[deploy]
  # Applies pending Alembic migrations before the new version starts
  # serving traffic — this is the one service in the family using real
  # migrations instead of boot-time ALTER TABLE, so this step is
  # required (there's no ensure_schema() fallback here).
  release_command = "/app/.venv/bin/alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero. Self-hosted installs push on a 30-minute background
  # tick, so this service is idle by default — today, with no self-hosted
  # installs, it serves nothing at all.
  #
  # The previous comment here reached the opposite conclusion from the
  # same facts: that ticks "arrive on their own schedule, not in response
  # to user traffic" was treated as an argument for staying warm, when it
  # is precisely what makes the workload intermittent. It also asserted
  # "no real cost benefit at this service's expected traffic" — at 48
  # requests a day per install, the machine is idle ~95% of the time.
  #
  # Safe for the same three reasons as the License Service (see the
  # longer note in its fly.toml): boot fits inside Fly's ~8s proxy
  # window, the caller's timeout is longer than that window, and a failed
  # push is fail-soft — sync_client.py just retries on the next tick,
  # with the operator's local SQLite remaining the source of truth
  # throughout. Nothing is lost by missing one push.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
